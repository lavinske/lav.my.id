[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "24"

# Force bare domain (lav.my.id), redirect www to bare
[[redirects]]
  from = "https://www.lav.my.id/*"
  to   = "https://lav.my.id/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # NOTE: 'unsafe-inline' required for page-level inline scripts (hero typewriter,
    # blog search, TOC scrollspy, 404 body class) and the FOUC-preventing theme script.
    # Adding a sha256 hash here would make browsers IGNORE 'unsafe-inline' and break them.
    # Upgrade path: move those 4 page scripts to /public/scripts/, then hash the 2 remaining
    # inline theme scripts and drop 'unsafe-inline'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://utteranc.es; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src https://utteranc.es; connect-src 'self' https://webmention.io; object-src 'none'; base-uri 'self'"
