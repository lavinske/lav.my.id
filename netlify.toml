[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "24"

# Force bare domain (lav.my.id), redirect www to bare
[[redirects]]
  from = "https://www.lav.my.id/*"
  to   = "https://lav.my.id/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "DENY"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy  = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; frame-src https://utteranc.es; connect-src 'self' https://webmention.io; object-src 'none'; base-uri 'self'"
